name: simulados_stack

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: simulados_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./simulados:/var/www/html
    environment:
      TZ: America/Sao_Paulo
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-simulados}
      DB_USERNAME: ${MYSQL_USER:-simulados}
      DB_PASSWORD: ${MYSQL_PASSWORD:-simulados}
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 1536m
    deploy:
      resources:
        limits:
          memory: 1536m

  mysql:
    image: mysql:8.4
    container_name: simulados_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      TZ: America/Sao_Paulo
      MYSQL_DATABASE: ${MYSQL_DATABASE:-simulados}
      MYSQL_USER: ${MYSQL_USER:-simulados}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-simulados}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
    mem_limit: 1024m
    deploy:
      resources:
        limits:
          memory: 1024m

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: simulados_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      TZ: America/Sao_Paulo
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 256M
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  mysql_data:
